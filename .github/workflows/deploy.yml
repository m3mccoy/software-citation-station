name: Build and deploy new container
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Fetch Zenodo Versions"]
    types:
      - completed
jobs:
  clone-repo:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Clone the repository files onto the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Verify the files are copied
      - name: List files
        run: ls -la

      # Step 3: Build Docker Image From Newest Repo
      - name: Build Docker Image
        run: |
          TAG=$(date -u +%Y%m%d-%H%M%S)
          docker buildx build --platform=linux/amd64 -t mmccoy1234/software-citation-station:$TAG .

      # Step 4: Make sure Docker Image Built Successfully
      - name: List Docker Images
        run: docker image ls

      # Step 5: Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
