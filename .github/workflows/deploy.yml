name: Build and push updated container to ghcr
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Fetch Zenodo Versions"]
    types:
      - completed
jobs:
  clone-repo:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Clone the repository files onto the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Verify the files are copied
      - name: List files
        run: ls -la

      # # Step 3: Build Docker Image From Newest Repo
      # - name: Build Docker Image
      #   run: |
      #     TAG=$(date -u +%Y%m%d-%H%M%S)
      #     docker buildx build --platform=linux/amd64 -t mmccoy1234/software-citation-station:$TAG .

      # Step 4: Make sure Docker Image Built Successfully
      # - name: List Docker Images
      #   run: docker image ls

      # Sets up Docker Buildx for advanced build capabilities
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extracts metadata (tags, labels) to automate image versioning
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      # Step 5: Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Dockerfile and push it to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
